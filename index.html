<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road Racing Hero</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#ff5f1f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f14; --panel:#171a21; --panel2:#1e222b; --accent:#ff5f1f; --accent2:#00d4ff;
  --gold:#ffcd3c; --text:#f1f1f1; --muted:#8891a3; --danger:#ff4d5e;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden;}
h1,h2,h3,.disp{font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:.5px;}
#app{position:relative;width:100%;height:100%;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;}
.screen.active{display:flex;}

/* ---- HOME ---- */
#home{align-items:center;justify-content:center;padding:24px;background:
  radial-gradient(circle at 50% 0%, #1c2130 0%, var(--bg) 60%);}
.speedlines{position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.25;}
.speedline{position:absolute;height:3px;background:linear-gradient(90deg,transparent,var(--accent2),transparent);width:60%;animation:zoom 2.4s linear infinite;}
@keyframes zoom{from{transform:translateX(-120%)}to{transform:translateX(220%)}}
.brand{text-align:center;margin-bottom:6px;z-index:1;}
.brand .title{font-size:44px;line-height:1;color:var(--text);text-transform:uppercase;text-shadow:0 0 24px rgba(255,95,31,.5);}
.brand .title span{color:var(--accent);}
.brand .maker{margin-top:6px;color:var(--muted);font-size:14px;letter-spacing:1px;}
.wallet-pill{margin:18px 0 30px;background:var(--panel);border:1px solid #2a2f3a;border-radius:999px;padding:8px 20px;display:flex;align-items:center;gap:8px;font-family:'Rajdhani';font-weight:700;font-size:20px;z-index:1;}
.wallet-pill .coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2b0,var(--gold));box-shadow:0 0 8px rgba(255,205,60,.7);}
.menu{display:flex;flex-direction:column;gap:14px;width:100%;max-width:340px;z-index:1;}
.menu-btn{position:relative;overflow:hidden;border:none;border-radius:14px;padding:20px 22px;font-family:'Rajdhani';font-size:26px;font-weight:700;text-align:left;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:transform .15s;}
.menu-btn:active{transform:scale(.97);}
.menu-btn .sub{display:block;font-family:'Inter';font-weight:400;font-size:12px;color:rgba(255,255,255,.75);margin-top:2px;}
.menu-btn.play{background:linear-gradient(120deg,#ff5f1f,#ff8a3d);}
.menu-btn.shop{background:linear-gradient(120deg,#1e222b,#262c38);border:1px solid #333a48;}
.menu-btn.vault{background:linear-gradient(120deg,#1e222b,#262c38);border:1px solid #333a48;}
.menu-btn .ic{font-size:26px;}

/* ---- SHARED TOPBAR ---- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--panel);border-bottom:1px solid #262b36;position:sticky;top:0;z-index:5;}
.topbar h2{margin:0;font-size:22px;}
.backbtn{background:none;border:1px solid #333a48;color:var(--text);border-radius:8px;padding:8px 14px;font-family:'Rajdhani';font-weight:700;font-size:16px;cursor:pointer;}
.coincount{display:flex;align-items:center;gap:6px;font-family:'Rajdhani';font-weight:700;color:var(--gold);}
.coincount .coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2b0,var(--gold));}

/* ---- SHOP / VAULT GRID ---- */
.grid-wrap{padding:14px;flex:1;}
.filters{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;}
.filters button{flex:none;background:var(--panel2);border:1px solid #2a2f3a;color:var(--muted);border-radius:999px;padding:6px 14px;font-size:13px;font-family:'Rajdhani';font-weight:700;cursor:pointer;}
.filters button.on{color:var(--bg);background:var(--accent2);border-color:var(--accent2);}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.card{background:var(--panel);border:1px solid #262b36;border-radius:14px;padding:10px;position:relative;}
.card .tier{position:absolute;top:8px;left:8px;font-size:10px;font-family:'Rajdhani';font-weight:700;color:var(--muted);background:rgba(0,0,0,.4);padding:2px 6px;border-radius:6px;}
.card svg{width:100%;height:64px;display:block;}
.card .cname{font-family:'Rajdhani';font-weight:700;font-size:15px;margin:6px 0 2px;}
.card .stats{display:flex;gap:6px;margin:6px 0;}
.statbar{flex:1;height:4px;background:#2a2f3a;border-radius:2px;overflow:hidden;}
.statbar i{display:block;height:100%;background:var(--accent2);}
.card .price{display:flex;align-items:center;gap:5px;font-family:'Rajdhani';font-weight:700;color:var(--gold);font-size:14px;margin-top:4px;}
.card button{width:100%;margin-top:8px;border:none;border-radius:8px;padding:8px;font-family:'Rajdhani';font-weight:700;font-size:14px;cursor:pointer;}
.card button.buy{background:var(--accent);color:#fff;}
.card button.select{background:var(--accent2);color:#03222a;}
.card button.selected{background:#2a2f3a;color:var(--muted);}
.card button:disabled{background:#2a2f3a;color:#555c6b;cursor:not-allowed;}

/* ---- PLAY ---- */
#play{background:#000;}
#gameCanvas{width:100%;height:100%;display:block;touch-action:none;}
.hud{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;font-family:'Rajdhani';font-weight:700;pointer-events:none;}
.hud .pill{background:rgba(13,15,20,.7);border:1px solid #2a2f3a;border-radius:999px;padding:6px 14px;font-size:15px;}
.touchctrl{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;}
.touchbtn{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;user-select:none;}
.overlay{position:absolute;inset:0;background:rgba(6,7,10,.9);display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;}
.overlay.show{display:flex;}
.overlay h2{font-size:34px;margin-bottom:6px;}
.overlay .earned{color:var(--gold);font-family:'Rajdhani';font-weight:700;font-size:20px;margin:10px 0 22px;}
.overlay button{background:var(--accent);border:none;color:#fff;font-family:'Rajdhani';font-weight:700;font-size:18px;padding:12px 28px;border-radius:10px;margin:6px;cursor:pointer;}
.overlay button.ghost{background:transparent;border:1px solid #333a48;}
#countdown{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-family:'Rajdhani';font-size:110px;font-weight:700;color:var(--accent2);text-shadow:0 0 30px rgba(0,212,255,.6);}
::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <div id="home" class="screen active">
    <div class="speedlines">
      <div class="speedline" style="top:20%;animation-delay:0s"></div>
      <div class="speedline" style="top:45%;animation-delay:.8s"></div>
      <div class="speedline" style="top:70%;animation-delay:1.5s"></div>
    </div>
    <div class="brand">
      <div class="title">ROAD RACING <span>HERO</span></div>
      <div class="maker">Made by Afraz Studio</div>
    </div>
    <div class="wallet-pill"><span class="coin"></span><span id="homeCoins">0</span></div>
    <div class="menu">
      <button class="menu-btn play" onclick="goPlay()"><span><span class="ic">▶</span> PLAY<span class="sub">Start racing now</span></span></button>
      <button class="menu-btn shop" onclick="showScreen('shop')"><span><span class="ic">🛒</span> SHOP<span class="sub">Buy new cars with coins</span></span></button>
      <button class="menu-btn vault" onclick="showScreen('vault')"><span><span class="ic">🔐</span> VAULT<span class="sub">Your garage & selected car</span></span></button>
    </div>
  </div>

  <!-- SHOP -->
  <div id="shop" class="screen">
    <div class="topbar">
      <button class="backbtn" onclick="showScreen('home')">← Back</button>
      <h2>Shop</h2>
      <div class="coincount"><span class="coin"></span><span id="shopCoins">0</span></div>
    </div>
    <div class="grid-wrap">
      <div class="filters" id="shopFilters"></div>
      <div class="grid" id="shopGrid"></div>
    </div>
  </div>

  <!-- VAULT -->
  <div id="vault" class="screen">
    <div class="topbar">
      <button class="backbtn" onclick="showScreen('home')">← Back</button>
      <h2>Vault</h2>
      <div class="coincount"><span class="coin"></span><span id="vaultCoins">0</span></div>
    </div>
    <div class="grid-wrap">
      <div class="grid" id="vaultGrid"></div>
    </div>
  </div>

  <!-- PLAY -->
  <div id="play" class="screen">
    <canvas id="gameCanvas"></canvas>
    <div class="hud">
      <div class="pill">SPEED <span id="hudSpeed">0</span></div>
      <div class="pill"><span class="coin" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2b0,#ffcd3c);vertical-align:middle;margin-right:4px;"></span><span id="hudCoins">0</span></div>
      <div class="pill">DIST <span id="hudDist">0</span>m</div>
    </div>
    <div class="touchctrl">
      <div class="touchbtn" id="btnLeft">◀</div>
      <div class="touchbtn" id="btnRight">▶</div>
    </div>
    <div id="countdown">3</div>
    <div class="overlay" id="crashOverlay">
      <h2>WRECKED!</h2>
      <div>Distance: <b id="finalDist">0</b>m</div>
      <div class="earned">+<span id="finalCoins">0</span> coins earned</div>
      <div>
        <button onclick="startRace()">Race Again</button>
        <button class="ghost" onclick="showScreen('home')">Home</button>
      </div>
    </div>
  </div>

</div>

<script>
/* ---------------- DATA ---------------- */
const TYPES = ['Sedan','Coupe','Hatch','SUV','Pickup','Supercar','Muscle','Roadster','Kart','Hyper'];
const PALETTE = ['#e63946','#2a9d8f','#f4a261','#264653','#e9c46a','#8338ec','#ff006e','#3a86ff','#06d6a0','#ff5f1f'];
const TIERS = ['Rookie','Street','Pro','Elite','Legend'];

function buildCars(){
  const cars=[];
  for(let i=0;i<50;i++){
    const tier = Math.floor(i/10);
    const speed = 40 + i*3 + tier*4;
    const accel = 35 + ((i*7)%40) + tier*5;
    const handling = 35 + ((i*11)%40) + tier*4;
    const price = i===0 ? 0 : 150 + i*180 + tier*400;
    cars.push({
      id:i,
      name: TYPES[i%10]+' '+TIERS[tier]+' '+(i%10+1),
      tier: TIERS[tier],
      color: PALETTE[i%10],
      price, speed, accel, handling
    });
  }
  return cars;
}
const CARS = buildCars();

/* ---------------- STATE / SAVE ---------------- */
const SAVE_KEY='rrh_save_v1';
function loadState(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { coins:500, owned:[0], selected:0, best:0 };
}
let state = loadState();
function saveState(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){} }

/* ---------------- NAV ---------------- */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  refreshCoinDisplays();
  if(id==='shop') renderShop();
  if(id==='vault') renderVault();
}
function refreshCoinDisplays(){
  document.getElementById('homeCoins').textContent = state.coins;
  document.getElementById('shopCoins').textContent = state.coins;
  document.getElementById('vaultCoins').textContent = state.coins;
}

/* ---------------- CAR SVG (supercar silhouette for shop/vault) ---------------- */
function carSVG(color){
  return `<svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g${color.replace('#','')}" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="${shadeHex(color,45)}"/>
        <stop offset="40%" stop-color="${color}"/>
        <stop offset="100%" stop-color="${shadeHex(color,-55)}"/>
      </linearGradient>
    </defs>
    <ellipse cx="100" cy="84" rx="88" ry="7" fill="rgba(0,0,0,.45)"/>
    <!-- Angular supercar body (Lambo/Ferrari wedge) -->
    <path d="M18 68 L28 48 L48 38 L72 28 L130 28 L155 36 L175 48 L184 68 L175 74 L25 74 Z" fill="url(#g${color.replace('#','')})"/>
    <!-- Cabin / canopy -->
    <path d="M78 30 L125 30 L138 42 L70 42 Z" fill="#0a0c12" opacity=".92"/>
    <path d="M82 32 L122 32 L132 40 L74 40 Z" fill="rgba(120,190,255,0.22)"/>
    <!-- Side air intake -->
    <path d="M40 52 L55 48 L58 60 L42 62 Z" fill="${shadeHex(color,-40)}"/>
    <path d="M145 48 L160 52 L158 62 L142 60 Z" fill="${shadeHex(color,-40)}"/>
    <!-- Wheels -->
    <circle cx="52" cy="72" r="15" fill="#0a0c12"/><circle cx="52" cy="72" r="7" fill="#1a2030"/><circle cx="52" cy="72" r="3" fill="#00d4ff"/>
    <circle cx="150" cy="72" r="15" fill="#0a0c12"/><circle cx="150" cy="72" r="7" fill="#1a2030"/><circle cx="150" cy="72" r="3" fill="#00d4ff"/>
    <!-- Tail lights -->
    <rect x="30" y="64" width="12" height="5" rx="1" fill="#ff2a2a"/>
    <rect x="158" y="64" width="12" height="5" rx="1" fill="#ff2a2a"/>
    <!-- Front splitter hint -->
    <path d="M70 72 L130 72 L128 76 L72 76 Z" fill="rgba(0,0,0,.5)"/>
  </svg>`;
}
function shadeHex(hex, amt){
  const c = hex.replace('#','');
  const n = parseInt(c.length===3? c.split('').map(x=>x+x).join(''):c,16);
  let r=(n>>16)+amt, g=(n>>8 & 255)+amt, b=(n & 255)+amt;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return `#${((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}`;
}
function statPct(v){ return Math.max(6, Math.min(100, v)); }

/* ---------------- SHOP ---------------- */
let shopFilter='all';
function renderShopFilters(){
  const el=document.getElementById('shopFilters');
  const opts=['all',...TIERS];
  el.innerHTML = opts.map(o=>`<button class="${o===shopFilter?'on':''}" onclick="shopFilter='${o}';renderShop()">${o==='all'?'All':o}</button>`).join('');
}
function renderShop(){
  renderShopFilters();
  const grid = document.getElementById('shopGrid');
  const list = CARS.filter(c=>shopFilter==='all'||c.tier===shopFilter);
  grid.innerHTML = list.map(c=>{
    const owned = state.owned.includes(c.id);
    const selected = state.selected===c.id;
    let btn;
    if(owned && selected) btn = `<button class="selected" disabled>Selected</button>`;
    else if(owned) btn = `<button class="select" onclick="selectCar(${c.id})">Select</button>`;
    else btn = `<button class="buy" ${state.coins<c.price?'disabled':''} onclick="buyCar(${c.id})">Buy</button>`;
    return `<div class="card"><span class="tier">${c.tier}</span>
      ${carSVG(c.color)}
      <div class="cname">${c.name}</div>
      <div class="stats">
        <div class="statbar" title="Speed"><i style="width:${statPct(c.speed)}%"></i></div>
        <div class="statbar" title="Accel"><i style="width:${statPct(c.accel)}%;background:var(--accent)"></i></div>
        <div class="statbar" title="Handling"><i style="width:${statPct(c.handling)}%;background:var(--gold)"></i></div>
      </div>
      <div class="price"><span class="coin" style="width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2b0,#ffcd3c);display:inline-block;"></span>${c.price===0?'Owned':c.price}</div>
      ${btn}
    </div>`;
  }).join('');
}
function buyCar(id){
  const car = CARS.find(c=>c.id===id);
  if(!car || state.owned.includes(id) || state.coins<car.price) return;
  state.coins -= car.price;
  state.owned.push(id);
  saveState();
  renderShop(); refreshCoinDisplays();
}
function selectCar(id){
  if(!state.owned.includes(id)) return;
  state.selected = id;
  saveState();
  renderShop();
}

/* ---------------- VAULT ---------------- */
function renderVault(){
  const grid = document.getElementById('vaultGrid');
  const owned = CARS.filter(c=>state.owned.includes(c.id));
  grid.innerHTML = owned.map(c=>{
    const selected = state.selected===c.id;
    return `<div class="card"><span class="tier">${c.tier}</span>
      ${carSVG(c.color)}
      <div class="cname">${c.name}</div>
      <div class="stats">
        <div class="statbar"><i style="width:${statPct(c.speed)}%"></i></div>
        <div class="statbar"><i style="width:${statPct(c.accel)}%;background:var(--accent)"></i></div>
        <div class="statbar"><i style="width:${statPct(c.handling)}%;background:var(--gold)"></i></div>
      </div>
      ${selected? `<button class="selected" disabled>In Use</button>` : `<button class="select" onclick="selectCar(${c.id});renderVault()">Use This Car</button>`}
    </div>`;
  }).join('') || `<p style="color:var(--muted)">No cars yet — visit the Shop!</p>`;
}

/* ---------------- GAME (canvas endless racer) ---------------- */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W,H;
function fitCanvas(){
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = canvas.width = Math.floor(canvas.clientWidth * dpr);
  H = canvas.height = Math.floor(canvas.clientHeight * dpr);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
}
window.addEventListener('resize', fitCanvas);

let raceState = null;
function goPlay(){ showScreen('play'); startRace(); }

function startRace(){
  document.getElementById('crashOverlay').classList.remove('show');
  fitCanvas();
  const car = CARS.find(c=>c.id===state.selected) || CARS[0];
  raceState = {
    car, lane:1,
    playerY:0.86, dist:0, speed: 1.4, baseSpeed: 1.4, topSpeed: 4 + car.speed*0.05,
    obstacles:[], coins:[], t:0, coinsEarned:0, running:false, crashed:false,
    buildingsL: makeSkyline(), buildingsR: makeSkyline(),
    lastTs: null, visualLane: 1
  };
  document.getElementById('countdown').style.display='flex';
  let n=3;
  document.getElementById('countdown').textContent=n;
  const iv = setInterval(()=>{
    n--;
    if(n<=0){ clearInterval(iv); document.getElementById('countdown').style.display='none'; raceState.running=true; requestAnimationFrame(loop); }
    else document.getElementById('countdown').textContent=n;
  },700);
}

function laneChange(dir){
  if(!raceState || !raceState.running) return;
  raceState.lane = Math.max(0, Math.min(2, raceState.lane+dir));
}
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft'||e.key==='a') laneChange(-1);
  if(e.key==='ArrowRight'||e.key==='d') laneChange(1);
});
document.getElementById('btnLeft').addEventListener('touchstart', e=>{e.preventDefault();laneChange(-1);});
document.getElementById('btnRight').addEventListener('touchstart', e=>{e.preventDefault();laneChange(1);});
document.getElementById('btnLeft').addEventListener('click', ()=>laneChange(-1));
document.getElementById('btnRight').addEventListener('click', ()=>laneChange(1));

const HORIZON = 0.34;
function clamp01(v){ return Math.max(0, Math.min(1, v)); }

// CONSTANT road width — same size from top to bottom (no tapering / squeezing)
function roadHalfWidth(){
  return W * 0.42; // fixed half-width for entire road
}
function screenY(p){ return H * (HORIZON + (1 - HORIZON) * clamp01(p)); }
function laneOffset(lane){ return (lane - 1) * 0.55; }
function laneToX(lane, p=0.86){
  const hw = roadHalfWidth();
  return W * 0.5 + laneOffset(lane) * hw;
}

function makeSkyline(){
  const arr=[];
  let x=0;
  while(x<3200){
    const w = 50 + Math.random()*110;
    const h = 100 + Math.random()*280;
    arr.push({
      x, w, h,
      hue: 205 + Math.random()*35,
      sat: 12 + Math.random()*18,
      lit: []
    });
    const litCount = 4 + Math.floor(Math.random()*10);
    for(let i=0;i<litCount;i++){
      arr[arr.length-1].lit.push({
        ox: 0.08 + Math.random()*0.84,
        oy: 0.06 + Math.random()*0.88,
        warm: Math.random() > 0.6
      });
    }
    x += w + 14 + Math.random()*12;
  }
  return arr;
}

function drawSky(r){
  const hy = H * HORIZON;
  const sky = ctx.createLinearGradient(0, 0, 0, hy);
  sky.addColorStop(0, '#4a9fd4');
  sky.addColorStop(0.35, '#7ec8e8');
  sky.addColorStop(0.7, '#c5e6f5');
  sky.addColorStop(0.92, '#f0d9a8');
  sky.addColorStop(1, '#f8e6b8');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, hy);

  const sunX = W * 0.74, sunY = hy * 0.38, sunR = W * 0.075;
  const glow = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR * 4.5);
  glow.addColorStop(0, 'rgba(255,250,220,0.95)');
  glow.addColorStop(0.15, 'rgba(255,240,180,0.55)');
  glow.addColorStop(0.4, 'rgba(255,220,140,0.18)');
  glow.addColorStop(1, 'rgba(255,220,140,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(sunX, sunY, sunR * 4.5, 0, Math.PI * 2); ctx.fill();

  const sunGrad = ctx.createRadialGradient(sunX - sunR*0.2, sunY - sunR*0.2, 0, sunX, sunY, sunR);
  sunGrad.addColorStop(0, '#fffef5');
  sunGrad.addColorStop(0.7, '#fff2c8');
  sunGrad.addColorStop(1, '#ffe8a0');
  ctx.fillStyle = sunGrad;
  ctx.beginPath(); ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#b8d4b0';
  ctx.beginPath();
  ctx.moveTo(0, hy);
  for(let x = 0; x <= W; x += W / 12){
    const wave = Math.sin(x * 0.008 + 1.8) * H * 0.018 + Math.sin(x * 0.015 + 0.5) * H * 0.008;
    ctx.lineTo(x, hy - wave - H * 0.015);
  }
  ctx.lineTo(W, hy);
  ctx.closePath();
  ctx.fill();

  const haze = ctx.createLinearGradient(0, hy - H*0.08, 0, hy);
  haze.addColorStop(0, 'rgba(240,230,200,0)');
  haze.addColorStop(1, 'rgba(240,220,180,0.35)');
  ctx.fillStyle = haze;
  ctx.fillRect(0, hy - H*0.08, W, H*0.08);
}

function drawSkyline(list, side, r){
  const hy = H * HORIZON;
  const scroll = (r.dist * 2.8) % 3200;
  list.forEach(b => {
    let bx = b.x - scroll;
    if(bx < -500) bx += 3200;
    if(bx > 3200) bx -= 3200;
    if(bx < -350 || bx > W + 350) return;

    const px = side === 'L' ? bx * 0.11 : W - bx * 0.11;
    const bw = b.w * 0.52;
    const bh = b.h * 0.68;

    const grad = ctx.createLinearGradient(0, hy - bh, 0, hy);
    const light = side === 'L' ? 28 : 24;
    grad.addColorStop(0, `hsl(${b.hue},${b.sat}%,${light + 8}%)`);
    grad.addColorStop(0.6, `hsl(${b.hue},${b.sat}%,${light}%)`);
    grad.addColorStop(1, `hsl(${b.hue},${b.sat - 4}%,${light - 10}%)`);
    ctx.fillStyle = grad;
    ctx.fillRect(px, hy - bh, bw, bh);

    ctx.fillStyle = `hsla(${b.hue},${b.sat}%,${light + 18}%,0.35)`;
    ctx.fillRect(px, hy - bh, bw * 0.04, bh);

    b.lit.forEach(w => {
      const wx = px + w.ox * bw;
      const wy = hy - bh + w.oy * bh;
      const ww = Math.max(1.5, bw * 0.055);
      const wh = Math.max(1.5, bw * 0.055);
      ctx.fillStyle = w.warm ? 'rgba(255,220,140,0.9)' : 'rgba(180,220,255,0.75)';
      ctx.fillRect(wx, wy, ww, wh);
    });
  });
}

function drawRoad(r){
  const hy = H * HORIZON;
  drawSky(r);
  drawSkyline(r.buildingsL, 'L', r);
  drawSkyline(r.buildingsR, 'R', r);

  // Grass
  const grassGrad = ctx.createLinearGradient(0, hy, 0, H);
  grassGrad.addColorStop(0, '#5a9e5e');
  grassGrad.addColorStop(0.3, '#4a8c4e');
  grassGrad.addColorStop(1, '#3a7040');
  ctx.fillStyle = grassGrad;
  ctx.fillRect(0, hy, W, H - hy);

  const hw = roadHalfWidth(); // CONSTANT width

  // Shoulder / dirt strips (parallel)
  ctx.fillStyle = '#6b5b45';
  ctx.fillRect(W*0.5 - hw*1.12, hy, hw*0.12, H - hy);
  ctx.fillRect(W*0.5 + hw, hy, hw*0.12, H - hy);

  // Main asphalt — perfect rectangle (same width top to bottom)
  const roadGrad = ctx.createLinearGradient(0, hy, 0, H);
  roadGrad.addColorStop(0, '#3a3e48');
  roadGrad.addColorStop(0.4, '#2f333c');
  roadGrad.addColorStop(1, '#252830');
  ctx.fillStyle = roadGrad;
  ctx.fillRect(W*0.5 - hw, hy, hw * 2, H - hy);

  // Subtle asphalt texture bands
  ctx.save();
  ctx.beginPath();
  ctx.rect(W*0.5 - hw, hy, hw * 2, H - hy);
  ctx.clip();
  for(let i = 0; i < 20; i++){
    const tt = i / 20;
    const y0 = hy + (H - hy) * tt;
    const y1 = hy + (H - hy) * Math.min(1, tt + 0.055);
    const alpha = 0.025 + 0.02 * Math.sin(tt * 14 + r.t * 0.4);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fillRect(W*0.5 - hw, y0, hw * 2, y1 - y0);
  }
  ctx.restore();

  // Yellow edge lines — perfectly parallel, constant thickness
  ctx.lineCap = 'butt';
  ctx.strokeStyle = '#f5c842';
  ctx.lineWidth = Math.max(2.5, W * 0.006);
  // left
  ctx.beginPath();
  ctx.moveTo(W*0.5 - hw, hy);
  ctx.lineTo(W*0.5 - hw, H);
  ctx.stroke();
  // right
  ctx.beginPath();
  ctx.moveTo(W*0.5 + hw, hy);
  ctx.lineTo(W*0.5 + hw, H);
  ctx.stroke();

  // White dashed lane dividers — parallel, scrolling
  const dashPhase = (r.t * r.speed * 5.5) % 1;
  const laneSegs = 36;
  const dashLen = (H - hy) / laneSegs;
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = Math.max(2, W * 0.0045);
  for(let i = 0; i < laneSegs; i++){
    const t0 = (i / laneSegs + dashPhase / laneSegs) % 1;
    const y0 = hy + (H - hy) * t0;
    const y1 = Math.min(H, y0 + dashLen * 0.45);
    if(y1 <= y0) continue;
    // left lane line
    ctx.beginPath();
    ctx.moveTo(W*0.5 - hw * 0.33, y0);
    ctx.lineTo(W*0.5 - hw * 0.33, y1);
    ctx.stroke();
    // right lane line
    ctx.beginPath();
    ctx.moveTo(W*0.5 + hw * 0.33, y0);
    ctx.lineTo(W*0.5 + hw * 0.33, y1);
    ctx.stroke();
  }

  // Soft center dashed line
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = Math.max(1.5, W * 0.003);
  for(let i = 0; i < 28; i++){
    const t0 = (i / 28 + dashPhase * 0.7 / 28) % 1;
    const y0 = hy + (H - hy) * t0;
    const y1 = Math.min(H, y0 + dashLen * 0.3);
    if(y1 <= y0) continue;
    ctx.beginPath();
    ctx.moveTo(W*0.5, y0);
    ctx.lineTo(W*0.5, y1);
    ctx.stroke();
  }

  // Horizon markers (soft, no pinching)
  const pulse = 0.45 + 0.35 * Math.sin(r.t * 2.8);
  [0,1,2].forEach(lane => {
    const lx = laneToX(lane);
    ctx.save();
    ctx.globalAlpha = 0.22 + 0.22 * pulse;
    const mg = ctx.createRadialGradient(lx, hy, 0, lx, hy, W * 0.02);
    mg.addColorStop(0, 'rgba(0,212,255,0.85)');
    mg.addColorStop(1, 'rgba(0,212,255,0)');
    ctx.fillStyle = mg;
    ctx.beginPath();
    ctx.arc(lx, hy + H*0.003, W*0.016, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });

  // Vignette
  const vig = ctx.createRadialGradient(W*0.5, H*0.65, H*0.15, W*0.5, H*0.65, H*0.95);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(0.7, 'rgba(0,0,0,0.12)');
  vig.addColorStop(1, 'rgba(0,0,0,0.42)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);
}

function shade(hex, amt){
  const c = hex.replace('#','');
  const n = parseInt(c.length===3? c.split('').map(x=>x+x).join(''):c,16);
  let r=(n>>16)+amt, g=(n>>8 & 255)+amt, b=(n & 255)+amt;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return `rgb(${r},${g},${b})`;
}

// Ultra-detailed angular supercar (Lamborghini / Ferrari style)
function drawCarSprite(x, y, color, scaleMul, facingBack, progress){
  const t = clamp01(progress === undefined ? 1 : progress);
  const fadeIn = Math.min(1, t / 0.12);
  // Scale still changes with depth for 3D feel, but road width stays constant
  const scale = (0.22 + 0.88 * t) * scaleMul;
  const w = W * 0.155 * scale;
  const h = w * 0.52; // lower, wider stance like a true supercar
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = fadeIn;

  // Contact shadow
  const sh = ctx.createRadialGradient(0, h*0.42, 0, 0, h*0.42, w*0.55);
  sh.addColorStop(0, 'rgba(0,0,0,0.5)');
  sh.addColorStop(0.55, 'rgba(0,0,0,0.2)');
  sh.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sh;
  ctx.beginPath();
  ctx.ellipse(0, h*0.42, w*0.5, h*0.12, 0, 0, Math.PI*2);
  ctx.fill();

  // === MAIN BODY — sharp wedge silhouette ===
  const bodyGrad = ctx.createLinearGradient(-w*0.5, -h*0.5, w*0.5, h*0.35);
  bodyGrad.addColorStop(0, shade(color, 60));
  bodyGrad.addColorStop(0.2, shade(color, 30));
  bodyGrad.addColorStop(0.5, color);
  bodyGrad.addColorStop(0.8, shade(color, -35));
  bodyGrad.addColorStop(1, shade(color, -60));
  ctx.fillStyle = bodyGrad;

  // Aggressive angular body path (rear view for traffic / player)
  ctx.beginPath();
  // Bottom rear corners
  ctx.moveTo(-w*0.48, h*0.22);
  // Left rear shoulder up
  ctx.lineTo(-w*0.52, h*0.05);
  ctx.lineTo(-w*0.45, -h*0.12);
  // Left roof edge
  ctx.lineTo(-w*0.28, -h*0.28);
  // Roof top
  ctx.lineTo(w*0.28, -h*0.28);
  // Right roof edge
  ctx.lineTo(w*0.45, -h*0.12);
  ctx.lineTo(w*0.52, h*0.05);
  // Right rear corner
  ctx.lineTo(w*0.48, h*0.22);
  // Bottom edge with slight diffuser curve
  ctx.quadraticCurveTo(0, h*0.32, -w*0.48, h*0.22);
  ctx.closePath();
  ctx.fill();

  // Side panel darkening for 3D volume
  const sideGrad = ctx.createLinearGradient(-w*0.5, 0, w*0.5, 0);
  sideGrad.addColorStop(0, 'rgba(0,0,0,0.42)');
  sideGrad.addColorStop(0.12, 'rgba(0,0,0,0.12)');
  sideGrad.addColorStop(0.5, 'rgba(0,0,0,0)');
  sideGrad.addColorStop(0.88, 'rgba(0,0,0,0.12)');
  sideGrad.addColorStop(1, 'rgba(0,0,0,0.42)');
  ctx.fillStyle = sideGrad;
  ctx.beginPath();
  ctx.moveTo(-w*0.48, h*0.22);
  ctx.lineTo(-w*0.52, h*0.05);
  ctx.lineTo(-w*0.45, -h*0.12);
  ctx.lineTo(-w*0.28, -h*0.28);
  ctx.lineTo(w*0.28, -h*0.28);
  ctx.lineTo(w*0.45, -h*0.12);
  ctx.lineTo(w*0.52, h*0.05);
  ctx.lineTo(w*0.48, h*0.22);
  ctx.quadraticCurveTo(0, h*0.32, -w*0.48, h*0.22);
  ctx.closePath();
  ctx.fill();

  // === ROOF / CABIN (hexagonal glass canopy style) ===
  const roofGrad = ctx.createLinearGradient(0, -h*0.55, 0, -h*0.22);
  roofGrad.addColorStop(0, shade(color, 25));
  roofGrad.addColorStop(1, shade(color, -25));
  ctx.fillStyle = roofGrad;
  ctx.beginPath();
  ctx.moveTo(-w*0.26, -h*0.28);
  ctx.lineTo(-w*0.18, -h*0.52);
  ctx.lineTo(w*0.18, -h*0.52);
  ctx.lineTo(w*0.26, -h*0.28);
  ctx.closePath();
  ctx.fill();
  // Roof edge highlight
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = Math.max(0.8, w * 0.01);
  ctx.stroke();

  // Glass canopy
  ctx.fillStyle = 'rgba(10,16,26,0.93)';
  ctx.beginPath();
  ctx.moveTo(-w*0.24, -h*0.28);
  ctx.lineTo(-w*0.16, -h*0.48);
  ctx.lineTo(w*0.16, -h*0.48);
  ctx.lineTo(w*0.24, -h*0.28);
  ctx.closePath();
  ctx.fill();
  // Glass reflection
  ctx.fillStyle = 'rgba(160,210,255,0.28)';
  ctx.beginPath();
  ctx.moveTo(-w*0.20, -h*0.29);
  ctx.lineTo(-w*0.13, -h*0.44);
  ctx.lineTo(-0.02*w, -h*0.44);
  ctx.lineTo(-0.10*w, -h*0.29);
  ctx.closePath();
  ctx.fill();

  // === SIDE AIR INTAKES (signature supercar feature) ===
  ctx.fillStyle = shade(color, -50);
  // Left intake
  ctx.beginPath();
  ctx.moveTo(-w*0.48, h*0.02);
  ctx.lineTo(-w*0.38, -h*0.05);
  ctx.lineTo(-w*0.36, h*0.10);
  ctx.lineTo(-w*0.46, h*0.14);
  ctx.closePath();
  ctx.fill();
  // Right intake
  ctx.beginPath();
  ctx.moveTo(w*0.48, h*0.02);
  ctx.lineTo(w*0.38, -h*0.05);
  ctx.lineTo(w*0.36, h*0.10);
  ctx.lineTo(w*0.46, h*0.14);
  ctx.closePath();
  ctx.fill();
  // Intake dark mesh
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(-w*0.45, h*0.01, w*0.07, h*0.09);
  ctx.fillRect(w*0.38, h*0.01, w*0.07, h*0.09);

  // === SIDE MIRRORS (stalk style) ===
  ctx.fillStyle = shade(color, -20);
  ctx.fillRect(-w*0.54, -h*0.18, w*0.08, h*0.06);
  ctx.fillRect(w*0.46, -h*0.18, w*0.08, h*0.06);
  ctx.fillStyle = 'rgba(30,50,70,0.85)';
  ctx.fillRect(-w*0.53, -h*0.17, w*0.05, h*0.035);
  ctx.fillRect(w*0.48, -h*0.17, w*0.05, h*0.035);

  // === WHEELS — low, wide, detailed ===
  [-1, 1].forEach(side => {
    const wx = side * w * 0.50;
    const wy = h * 0.12;
    // Tire
    ctx.fillStyle = '#080a10';
    ctx.beginPath();
    ctx.ellipse(wx, wy, w*0.10, h*0.16, 0, 0, Math.PI*2);
    ctx.fill();
    // Rim outer
    const rimGrad = ctx.createRadialGradient(wx - w*0.02, wy - h*0.02, 0, wx, wy, w*0.06);
    rimGrad.addColorStop(0, '#6a7588');
    rimGrad.addColorStop(0.5, '#2e3644');
    rimGrad.addColorStop(1, '#141820');
    ctx.fillStyle = rimGrad;
    ctx.beginPath();
    ctx.ellipse(wx, wy, w*0.055, h*0.09, 0, 0, Math.PI*2);
    ctx.fill();
    // Multi-spoke hint
    ctx.strokeStyle = 'rgba(180,200,220,0.35)';
    ctx.lineWidth = Math.max(0.8, w*0.008);
    for(let a=0; a<5; a++){
      const ang = (a / 5) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(wx, wy);
      ctx.lineTo(wx + Math.cos(ang)*w*0.045, wy + Math.sin(ang)*h*0.07);
      ctx.stroke();
    }
    // Center hub
    ctx.fillStyle = '#00c8f0';
    ctx.beginPath();
    ctx.ellipse(wx, wy, w*0.016, h*0.026, 0, 0, Math.PI*2);
    ctx.fill();
  });

  // === LIGHTS ===
  if(facingBack){
    // Horizontal LED taillight bar (modern Lambo style)
    ctx.shadowColor = '#ff2020';
    ctx.shadowBlur = w * 0.2;
    ctx.fillStyle = '#ff2828';
    ctx.fillRect(-w*0.38, h*0.15, w*0.76, h*0.055);
    ctx.shadowBlur = 0;
    // Bright center strip
    ctx.fillStyle = '#ff6666';
    ctx.fillRect(-w*0.32, h*0.165, w*0.64, h*0.025);
    // Outer units
    ctx.fillStyle = '#ff1010';
    ctx.fillRect(-w*0.40, h*0.14, w*0.08, h*0.07);
    ctx.fillRect(w*0.32, h*0.14, w*0.08, h*0.07);
  } else {
    // Player headlights — sharp angular units
    ctx.shadowColor = '#ffe8a0';
    ctx.shadowBlur = w * 0.25;
    ctx.fillStyle = '#fff6d0';
    // Left headlight cluster
    ctx.beginPath();
    ctx.moveTo(-w*0.42, h*0.12);
    ctx.lineTo(-w*0.28, h*0.10);
    ctx.lineTo(-w*0.26, h*0.20);
    ctx.lineTo(-w*0.40, h*0.22);
    ctx.closePath();
    ctx.fill();
    // Right
    ctx.beginPath();
    ctx.moveTo(w*0.42, h*0.12);
    ctx.lineTo(w*0.28, h*0.10);
    ctx.lineTo(w*0.26, h*0.20);
    ctx.lineTo(w*0.40, h*0.22);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    // Lens highlight
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillRect(-w*0.38, h*0.13, w*0.08, h*0.02);
    ctx.fillRect(w*0.30, h*0.13, w*0.08, h*0.02);
  }

  // Rear diffuser / bottom lip
  ctx.fillStyle = 'rgba(10,12,18,0.85)';
  ctx.beginPath();
  ctx.moveTo(-w*0.40, h*0.24);
  ctx.lineTo(w*0.40, h*0.24);
  ctx.lineTo(w*0.36, h*0.30);
  ctx.lineTo(-w*0.36, h*0.30);
  ctx.closePath();
  ctx.fill();
  // Diffuser fins
  ctx.fillStyle = 'rgba(40,45,55,0.9)';
  for(let i=-3; i<=3; i++){
    ctx.fillRect(i * w*0.09 - w*0.012, h*0.25, w*0.024, h*0.04);
  }

  // Subtle body panel line
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = Math.max(0.6, w*0.006);
  ctx.beginPath();
  ctx.moveTo(-w*0.42, -h*0.02);
  ctx.lineTo(w*0.42, -h*0.02);
  ctx.stroke();

  ctx.restore();
}

function spawnObstacle(){
  raceState.obstacles.push({
    lane: Math.floor(Math.random()*3),
    y: 0,
    color: PALETTE[Math.floor(Math.random()*PALETTE.length)]
  });
}
function spawnCoin(){
  raceState.coins.push({ lane: Math.floor(Math.random()*3), y: 0 });
}

function loop(ts){
  if(!raceState || raceState.crashed) return;
  const r = raceState;
  if(r.lastTs == null) r.lastTs = ts;
  let dt = (ts - r.lastTs) / 1000;
  r.lastTs = ts;
  dt = Math.min(dt, 0.05);
  const f = dt * 60;
  r.t += dt;

  const rampT = Math.min(1, r.dist / 900);
  r.speed = r.baseSpeed + (r.topSpeed - r.baseSpeed) * rampT;
  r.dist += r.speed * 0.15 * f;

  if(Math.random() < (0.008 + r.speed * 0.0016) * f) spawnObstacle();
  if(Math.random() < (0.02 + r.speed * 0.001) * f) spawnCoin();

  const advance = r.speed * 0.0032 * f;
  r.obstacles.forEach(o => o.y += advance * (0.5 + clamp01(o.y) * 1.2));
  r.coins.forEach(c => c.y += advance * (0.5 + clamp01(c.y) * 1.2));
  r.obstacles = r.obstacles.filter(o => o.y < 1.05);
  r.coins = r.coins.filter(c => c.y < 1.05);

  if(r.visualLane == null) r.visualLane = r.lane;
  r.visualLane += (r.lane - r.visualLane) * Math.min(1, 14 * dt);

  r.obstacles.forEach(o => {
    if(o.lane === r.lane && Math.abs(o.y - r.playerY) < 0.045 && !o.hit){
      o.hit = true;
      crash();
    }
  });
  r.coins = r.coins.filter(c => {
    if(c.lane === r.lane && Math.abs(c.y - r.playerY) < 0.05){
      r.coinsEarned += 5;
      return false;
    }
    return true;
  });

  drawRoad(r);
  r.obstacles.forEach(o => drawCarSprite(laneToX(o.lane, o.y), screenY(o.y), o.color, 1, true, o.y));
  r.coins.forEach(c => {
    const cy = screenY(c.y);
    const cs = (0.28 + 0.92 * clamp01(c.y));
    ctx.save();
    ctx.translate(laneToX(c.lane, c.y), cy);
    const cg = ctx.createRadialGradient(-W*0.004*cs, -W*0.004*cs, 0, 0, 0, W*0.02*cs);
    cg.addColorStop(0, '#fff6b0');
    cg.addColorStop(0.45, '#ffcd3c');
    cg.addColorStop(1, '#c99a18');
    ctx.fillStyle = cg;
    ctx.shadowColor = '#ffcd3c';
    ctx.shadowBlur = 12 * cs;
    ctx.beginPath();
    ctx.arc(0, 0, W*0.019*cs, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(180,130,20,0.6)';
    ctx.lineWidth = Math.max(1, W*0.003*cs);
    ctx.beginPath();
    ctx.arc(0, 0, W*0.012*cs, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  });

  const px = W*0.5 + laneOffset(r.visualLane) * roadHalfWidth();
  drawCarSprite(px, screenY(r.playerY), r.car.color, 1.08, false, r.playerY);

  document.getElementById('hudSpeed').textContent = Math.round(r.speed * 40);
  document.getElementById('hudDist').textContent = Math.round(r.dist);
  document.getElementById('hudCoins').textContent = r.coinsEarned;

  if(r.running) requestAnimationFrame(loop);
}

function crash(){
  raceState.crashed = true;
  const earned = raceState.coinsEarned + Math.floor(raceState.dist / 10);
  state.coins += earned;
  if(raceState.dist > state.best) state.best = Math.round(raceState.dist);
  saveState();
  document.getElementById('finalDist').textContent = Math.round(raceState.dist);
  document.getElementById('finalCoins').textContent = earned;
  document.getElementById('crashOverlay').classList.add('show');
}

/* ---------------- INIT ---------------- */
