<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road Racing Hero</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#ff5f1f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f14; --panel:#171a21; --panel2:#1e222b; --accent:#ff5f1f; --accent2:#00d4ff;
  --gold:#ffcd3c; --text:#f1f1f1; --muted:#8891a3; --danger:#ff4d5e;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden;}
h1,h2,h3,.disp{font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:.5px;}
#app{position:relative;width:100%;height:100%;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;}
.screen.active{display:flex;}
#home{align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 0%, #1c2130 0%, var(--bg) 60%);}
.speedlines{position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.25;}
.speedline{position:absolute;height:3px;background:linear-gradient(90deg,transparent,var(--accent2),transparent);width:60%;animation:zoom 2.4s linear infinite;}
@keyframes zoom{from{transform:translateX(-120%)}to{transform:translateX(220%)}}
.brand{text-align:center;margin-bottom:6px;z-index:1;}
.brand .title{font-size:44px;line-height:1;color:var(--text);text-transform:uppercase;text-shadow:0 0 24px rgba(255,95,31,.5);}
.brand .title span{color:var(--accent);}
.brand .maker{margin-top:6px;color:var(--muted);font-size:14px;letter-spacing:1px;}
.wallet-pill{margin:18px 0 30px;background:var(--panel);border:1px solid #2a2f3a;border-radius:999px;padding:8px 20px;display:flex;align-items:center;gap:8px;font-family:'Rajdhani';font-weight:700;font-size:20px;z-index:1;}
.wallet-pill .coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2b0,var(--gold));box-shadow:0 0 8px rgba(255,205,60,.7);}
.menu{display:flex;flex-direction:column;gap:14px;width:100%;max-width:340px;z-index:1;}
.menu-btn{position:relative;overflow:hidden;border:none;border-radius:14px;padding:20px 22px;font-family:'Rajdhani';font-size:26px;font-weight:700;text-align:left;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:transform .15s;}
.menu-btn:active{transform:scale(.97);}
.menu-btn .sub{display:block;font-family:'Inter';font-weight:400;font-size:12px;color:rgba(255,255,255,.75);margin-top:2px;}
.menu-btn.play{background:linear-gradient(120deg,#ff5f1f,#ff8a3d);}
.menu-btn.shop{background:linear-gradient(120deg,#1e222b,#262c38);border:1px solid #333a48;}
.menu-btn.vault{background:linear-gradient(120deg,#1e222b,#262c38);border:1px solid #333a48;}
.menu-btn .ic{font-size:26px;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--panel);border-bottom:1px solid #262b36;position:sticky;top:0;z-index:5;}
.topbar h2{margin:0;font-size:22px;}
.backbtn{background:none;border:1px solid #333a48;color:var(--text);border-radius:8px;padding:8px 14px;font-family:'Rajdhani';font-weight:700;font-size:16px;cursor:pointer;}
.coincount{display:flex;align-items:center;gap:6px;font-family:'Rajdhani';font-weight:700;color:var(--gold);}
.coincount .coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2b0,var(--gold));}
.grid-wrap{padding:14px;flex:1;}
.filters{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;}
.filters button{flex:none;background:var(--panel2);border:1px solid #2a2f3a;color:var(--muted);border-radius:999px;padding:6px 14px;font-size:13px;font-family:'Rajdhani';font-weight:700;cursor:pointer;}
.filters button.on{color:var(--bg);background:var(--accent2);border-color:var(--accent2);}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.card{background:var(--panel);border:1px solid #262b36;border-radius:14px;padding:10px;position:relative;}
.card .tier{position:absolute;top:8px;left:8px;font-size:10px;font-family:'Rajdhani';font-weight:700;color:var(--muted);background:rgba(0,0,0,.4);padding:2px 6px;border-radius:6px;}
.card svg{width:100%;height:64px;display:block;}
.card .cname{font-family:'Rajdhani';font-weight:700;font-size:15px;margin:6px 0 2px;}
.card .stats{display:flex;gap:6px;margin:6px 0;}
.statbar{flex:1;height:4px;background:#2a2f3a;border-radius:2px;overflow:hidden;}
.statbar i{display:block;height:100%;background:var(--accent2);}
.card .price{display:flex;align-items:center;gap:5px;font-family:'Rajdhani';font-weight:700;color:var(--gold);font-size:14px;margin-top:4px;}
.card button{width:100%;margin-top:8px;border:none;border-radius:8px;padding:8px;font-family:'Rajdhani';font-weight:700;font-size:14px;cursor:pointer;}
.card button.buy{background:var(--accent);color:#fff;}
.card button.select{background:var(--accent2);color:#03222a;}
.card button.selected{background:#2a2f3a;color:var(--muted);}
.card button:disabled{background:#2a2f3a;color:#555c6b;cursor:not-allowed;}
#play{background:#000;}
#gameCanvas{width:100%;height:100%;display:block;touch-action:none;}
.hud{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;font-family:'Rajdhani';font-weight:700;pointer-events:none;}
.hud .pill{background:rgba(13,15,20,.75);border:1px solid #2a2f3a;border-radius:999px;padding:6px 14px;font-size:15px;backdrop-filter:blur(6px);}
.touchctrl{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;}
.touchbtn{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;user-select:none;}
.overlay{position:absolute;inset:0;background:rgba(6,7,10,.92);display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;}
.overlay.show{display:flex;}
.overlay h2{font-size:34px;margin-bottom:6px;}
.overlay .earned{color:var(--gold);font-family:'Rajdhani';font-weight:700;font-size:20px;margin:10px 0 22px;}
.overlay button{background:var(--accent);border:none;color:#fff;font-family:'Rajdhani';font-weight:700;font-size:18px;padding:12px 28px;border-radius:10px;margin:6px;cursor:pointer;}
.overlay button.ghost{background:transparent;border:1px solid #333a48;}
#countdown{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-family:'Rajdhani';font-size:110px;font-weight:700;color:var(--accent2);text-shadow:0 0 30px rgba(0,212,255,.6);}
::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div id="app">
  <div id="home" class="screen active">
    <div class="speedlines">
      <div class="speedline" style="top:20%;animation-delay:0s"></div>
      <div class="speedline" style="top:45%;animation-delay:.8s"></div>
      <div class="speedline" style="top:70%;animation-delay:1.5s"></div>
    </div>
    <div class="brand">
      <div class="title">ROAD RACING <span>HERO</span></div>
      <div class="maker">Made by Afraz Studio</div>
    </div>
    <div class="wallet-pill"><span class="coin"></span><span id="homeCoins">0</span></div>
    <div class="menu">
      <button class="menu-btn play" onclick="goPlay()"><span><span class="ic">▶</span> PLAY<span class="sub">Start racing now</span></span></button>
      <button class="menu-btn shop" onclick="showScreen('shop')"><span><span class="ic">🛒</span> SHOP<span class="sub">Buy new cars with coins</span></span></button>
      <button class="menu-btn vault" onclick="showScreen('vault')"><span><span class="ic">🔐</span> VAULT<span class="sub">Your garage & selected car</span></span></button>
    </div>
  </div>
  <div id="shop" class="screen">
    <div class="topbar">
      <button class="backbtn" onclick="showScreen('home')">← Back</button>
      <h2>Shop</h2>
      <div class="coincount"><span class="coin"></span><span id="shopCoins">0</span></div>
    </div>
    <div class="grid-wrap">
      <div class="filters" id="shopFilters"></div>
      <div class="grid" id="shopGrid"></div>
    </div>
  </div>
  <div id="vault" class="screen">
    <div class="topbar">
      <button class="backbtn" onclick="showScreen('home')">← Back</button>
      <h2>Vault</h2>
      <div class="coincount"><span class="coin"></span><span id="vaultCoins">0</span></div>
    </div>
    <div class="grid-wrap">
      <div class="grid" id="vaultGrid"></div>
    </div>
  </div>
  <div id="play" class="screen">
    <canvas id="gameCanvas"></canvas>
    <div class="hud">
      <div class="pill">SPEED <span id="hudSpeed">0</span></div>
      <div class="pill"><span class="coin" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2b0,#ffcd3c);vertical-align:middle;margin-right:4px;"></span><span id="hudCoins">0</span></div>
      <div class="pill">DIST <span id="hudDist">0</span>m</div>
    </div>
    <div class="touchctrl">
      <div class="touchbtn" id="btnLeft">◀</div>
      <div class="touchbtn" id="btnRight">▶</div>
    </div>
    <div id="countdown">3</div>
    <div class="overlay" id="crashOverlay">
      <h2>WRECKED!</h2>
      <div>Distance: <b id="finalDist">0</b>m</div>
      <div class="earned">+<span id="finalCoins">0</span> coins earned</div>
      <div>
        <button onclick="startRace()">Race Again</button>
        <button class="ghost" onclick="showScreen('home')">Home</button>
      </div>
    </div>
  </div>
</div>
<script>
const TYPES = ['Sedan','Coupe','Hatch','SUV','Pickup','Supercar','Muscle','Roadster','Kart','Hyper'];
const PALETTE = ['#c41e3a','#1a6b5a','#c47a2a','#1e3a4c','#c9a84c','#5c2d91','#c41e6a','#1e5aa8','#1a9b6e','#d14a1a'];
const TIERS = ['Rookie','Street','Pro','Elite','Legend'];
function buildCars(){
  const cars=[];
  for(let i=0;i<50;i++){
    const tier = Math.floor(i/10);
    const speed = 40 + i*3 + tier*4;
    const accel = 35 + ((i*7)%40) + tier*5;
    const handling = 35 + ((i*11)%40) + tier*4;
    const price = i===0 ? 0 : 150 + i*180 + tier*400;
    cars.push({id:i,name:TYPES[i%10]+' '+TIERS[tier]+' '+(i%10+1),tier:TIERS[tier],color:PALETTE[i%10],price,speed,accel,handling});
  }
  return cars;
}
const CARS = buildCars();
const SAVE_KEY='rrh_save_v1';
function loadState(){
  try{const raw=localStorage.getItem(SAVE_KEY);if(raw)return JSON.parse(raw);}catch(e){}
  return {coins:500,owned:[0],selected:0,best:0};
}
let state = loadState();
function saveState(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch(e){}}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  refreshCoinDisplays();
  if(id==='shop')renderShop();
  if(id==='vault')renderVault();
}
function refreshCoinDisplays(){
  document.getElementById('homeCoins').textContent=state.coins;
  document.getElementById('shopCoins').textContent=state.coins;
  document.getElementById('vaultCoins').textContent=state.coins;
}
function carSVG(color){
  const id=color.replace('#','');
  return `<svg viewBox="0 0 220 110" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bg${id}" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="${shadeHex(color,50)}"/><stop offset="35%" stop-color="${color}"/>
        <stop offset="70%" stop-color="${shadeHex(color,-25)}"/><stop offset="100%" stop-color="${shadeHex(color,-55)}"/>
      </linearGradient>
      <linearGradient id="glass${id}" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#1a2535" stop-opacity="0.95"/><stop offset="100%" stop-color="#0a1018" stop-opacity="0.98"/>
      </linearGradient>
      <radialGradient id="sh${id}" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="rgba(0,0,0,0.55)"/><stop offset="100%" stop-color="rgba(0,0,0,0)"/>
      </radialGradient>
    </defs>
    <ellipse cx="110" cy="92" rx="95" ry="8" fill="url(#sh${id})"/>
    <path d="M22 72 L32 52 L52 40 L78 30 L145 30 L172 38 L192 52 L200 72 L190 80 L30 80 Z" fill="url(#bg${id})"/>
    <path d="M82 32 L140 32 L155 46 L72 46 Z" fill="url(#glass${id})"/>
    <path d="M86 34 L136 34 L147 44 L78 44 Z" fill="rgba(140,190,240,0.2)"/>
    <path d="M42 55 L58 50 L62 66 L45 68 Z" fill="${shadeHex(color,-45)}"/>
    <path d="M162 50 L178 55 L175 68 L158 66 Z" fill="${shadeHex(color,-45)}"/>
    <circle cx="55" cy="78" r="16" fill="#0a0c10"/><circle cx="55" cy="78" r="8" fill="#1c2430"/><circle cx="55" cy="78" r="3.5" fill="#2a9fd4"/>
    <circle cx="165" cy="78" r="16" fill="#0a0c10"/><circle cx="165" cy="78" r="8" fill="#1c2430"/><circle cx="165" cy="78" r="3.5" fill="#2a9fd4"/>
    <rect x="28" y="68" width="14" height="5" rx="1.5" fill="#e02020"/>
    <rect x="178" y="68" width="14" height="5" rx="1.5" fill="#e02020"/>
    <path d="M75 78 L145 78 L142 83 L78 83 Z" fill="rgba(0,0,0,0.55)"/>
  </svg>`;
}
function shadeHex(hex,amt){
  const c=hex.replace('#','');
  const n=parseInt(c.length===3?c.split('').map(x=>x+x).join(''):c,16);
  let r=(n>>16)+amt,g=(n>>8&255)+amt,b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return `#${((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}`;
}
function statPct(v){return Math.max(6,Math.min(100,v));}
let shopFilter='all';
function renderShopFilters(){
  const el=document.getElementById('shopFilters');
  const opts=['all',...TIERS];
  el.innerHTML=opts.map(o=>`<button class="${o===shopFilter?'on':''}" onclick="shopFilter='${o}';renderShop()">${o==='all'?'All':o}</button>`).join('');
}
function renderShop(){
  renderShopFilters();
  const grid=document.getElementById('shopGrid');
  const list=CARS.filter(c=>shopFilter==='all'||c.tier===shopFilter);
  grid.innerHTML=list.map(c=>{
    const owned=state.owned.includes(c.id);
    const selected=state.selected===c.id;
    let btn;
    if(owned&&selected)btn=`<button class="selected" disabled>Selected</button>`;
    else if(owned)btn=`<button class="select" onclick="selectCar(${c.id})">Select</button>`;
    else btn=`<button class="buy" ${state.coins<c.price?'disabled':''} onclick="buyCar(${c.id})">Buy</button>`;
    return `<div class="card"><span class="tier">${c.tier}</span>${carSVG(c.color)}
      <div class="cname">${c.name}</div>
      <div class="stats">
        <div class="statbar" title="Speed"><i style="width:${statPct(c.speed)}%"></i></div>
        <div class="statbar" title="Accel"><i style="width:${statPct(c.accel)}%;background:var(--accent)"></i></div>
        <div class="statbar" title="Handling"><i style="width:${statPct(c.handling)}%;background:var(--gold)"></i></div>
      </div>
      <div class="price"><span class="coin" style="width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2b0,#ffcd3c);display:inline-block;"></span>${c.price===0?'Owned':c.price}</div>
      ${btn}</div>`;
  }).join('');
}
function buyCar(id){
  const car=CARS.find(c=>c.id===id);
  if(!car||state.owned.includes(id)||state.coins<car.price)return;
  state.coins-=car.price;state.owned.push(id);saveState();renderShop();refreshCoinDisplays();
}
function selectCar(id){
  if(!state.owned.includes(id))return;
  state.selected=id;saveState();renderShop();
}
function renderVault(){
  const grid=document.getElementById('vaultGrid');
  const owned=CARS.filter(c=>state.owned.includes(c.id));
  grid.innerHTML=owned.map(c=>{
    const selected=state.selected===c.id;
    return `<div class="card"><span class="tier">${c.tier}</span>${carSVG(c.color)}
      <div class="cname">${c.name}</div>
      <div class="stats">
        <div class="statbar"><i style="width:${statPct(c.speed)}%"></i></div>
        <div class="statbar"><i style="width:${statPct(c.accel)}%;background:var(--accent)"></i></div>
        <div class="statbar"><i style="width:${statPct(c.handling)}%;background:var(--gold)"></i></div>
      </div>
      ${selected?`<button class="selected" disabled>In Use</button>`:`<button class="select" onclick="selectCar(${c.id});renderVault()">Use This Car</button>`}
    </div>`;
  }).join('')||`<p style="color:var(--muted)">No cars yet — visit the Shop!</p>`;
}
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
let W,H;
function fitCanvas(){
  const dpr=Math.min(window.devicePixelRatio||1,3);
  W=canvas.width=Math.floor(canvas.clientWidth*dpr);
  H=canvas.height=Math.floor(canvas.clientHeight*dpr);
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
}
window.addEventListener('resize',fitCanvas);
let raceState=null;
function goPlay(){showScreen('play');startRace();}
function startRace(){
  document.getElementById('crashOverlay').classList.remove('show');
  fitCanvas();
  const car=CARS.find(c=>c.id===state.selected)||CARS[0];
  raceState={car,lane:1,playerY:0.86,dist:0,speed:1.4,baseSpeed:1.4,topSpeed:4+car.speed*0.05,
    obstacles:[],coins:[],t:0,coinsEarned:0,running:false,crashed:false,
    buildingsL:makeSkyline(),buildingsR:makeSkyline(),lastTs:null,visualLane:1};
  document.getElementById('countdown').style.display='flex';
  let n=3;document.getElementById('countdown').textContent=n;
  const iv=setInterval(()=>{
    n--;
    if(n<=0){clearInterval(iv);document.getElementById('countdown').style.display='none';raceState.running=true;requestAnimationFrame(loop);}
    else document.getElementById('countdown').textContent=n;
  },700);
}
function laneChange(dir){
  if(!raceState||!raceState.running)return;
  raceState.lane=Math.max(0,Math.min(2,raceState.lane+dir));
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')laneChange(-1);
  if(e.key==='ArrowRight'||e.key==='d')laneChange(1);
});
document.getElementById('btnLeft').addEventListener('touchstart',e=>{e.preventDefault();laneChange(-1);});
document.getElementById('btnRight').addEventListener('touchstart',e=>{e.preventDefault();laneChange(1);});
document.getElementById('btnLeft').addEventListener('click',()=>laneChange(-1));
document.getElementById('btnRight').addEventListener('click',()=>laneChange(1));
const HORIZON=0.32;
function clamp01(v){return Math.max(0,Math.min(1,v));}
function roadHalfWidth(){return W*0.40;}
function screenY(p){return H*(HORIZON+(1-HORIZON)*clamp01(p));}
function laneOffset(lane){return (lane-1)*0.52;}
function laneToX(lane){return W*0.5+laneOffset(lane)*roadHalfWidth();}
function makeSkyline(){
  const arr=[];let x=0;
  while(x<3400){
    const w=48+Math.random()*120,h=90+Math.random()*300;
    arr.push({x,w,h,hue:200+Math.random()*40,sat:10+Math.random()*20,lit:[]});
    const litCount=5+Math.floor(Math.random()*12);
    for(let i=0;i<litCount;i++)arr[arr.length-1].lit.push({ox:0.07+Math.random()*0.86,oy:0.05+Math.random()*0.9,warm:Math.random()>0.55});
    x+=w+12+Math.random()*16;
  }
  return arr;
}
function drawSky(r){
  const hy=H*HORIZON;
  const sky=ctx.createLinearGradient(0,0,0,hy);
  sky.addColorStop(0,'#3d8ec8');sky.addColorStop(0.25,'#6bb5e0');sky.addColorStop(0.55,'#a8d4ef');
  sky.addColorStop(0.82,'#e8d5a8');sky.addColorStop(1,'#f5e6b8');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,hy);
  ctx.fillStyle='rgba(255,255,255,0.35)';
  for(let i=0;i<5;i++){
    const cx=(W*0.15+i*W*0.2+(r.dist*0.3)%W)%(W+100)-50;
    const cy=hy*(0.15+(i%3)*0.12);
    ctx.beginPath();
    ctx.ellipse(cx,cy,W*0.09,H*0.018,0,0,Math.PI*2);
    ctx.ellipse(cx+W*0.04,cy-H*0.008,W*0.06,H*0.014,0,0,Math.PI*2);
    ctx.ellipse(cx-W*0.035,cy-H*0.005,W*0.05,H*0.012,0,0,Math.PI*2);
    ctx.fill();
  }
  const sunX=W*0.76,sunY=hy*0.35,sunR=W*0.07;
  const bloom=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,sunR*5);
  bloom.addColorStop(0,'rgba(255,252,230,0.9)');bloom.addColorStop(0.12,'rgba(255,245,200,0.5)');
  bloom.addColorStop(0.35,'rgba(255,230,160,0.15)');bloom.addColorStop(1,'rgba(255,230,160,0)');
  ctx.fillStyle=bloom;ctx.beginPath();ctx.arc(sunX,sunY,sunR*5,0,Math.PI*2);ctx.fill();
  const sunGrad=ctx.createRadialGradient(sunX-sunR*0.25,sunY-sunR*0.25,0,sunX,sunY,sunR);
  sunGrad.addColorStop(0,'#fffef8');sunGrad.addColorStop(0.6,'#fff5d0');sunGrad.addColorStop(1,'#ffe8a8');
  ctx.fillStyle=sunGrad;ctx.beginPath();ctx.arc(sunX,sunY,sunR,0,Math.PI*2);ctx.fill();

function drawSkyline(list,side,r){
  const hy=H*HORIZON;
  const scroll=(r.dist*2.6)%3400;
  list.forEach(b=>{
    let bx=b.x-scroll;if(bx<-500)bx+=3400;if(bx>3400)bx-=3400;
    if(bx<-400||bx>W+400)return;
    const px=side==='L'?bx*0.10:W-bx*0.10;
    const bw=b.w*0.50,bh=b.h*0.65;
    const grad=ctx.createLinearGradient(0,hy-bh,0,hy);
    const light=side==='L'?26:22;
    grad.addColorStop(0,`hsl(${b.hue},${b.sat}%,${light+10}%)`);
    grad.addColorStop(0.5,`hsl(${b.hue},${b.sat}%,${light}%)`);
    grad.addColorStop(1,`hsl(${b.hue},${b.sat-5}%,${light-12}%)`);
    ctx.fillStyle=grad;ctx.fillRect(px,hy-bh,bw,bh);
    ctx.fillStyle=`hsla(${b.hue},${b.sat}%,${light+20}%,0.3)`;

function drawRoad(r){

  const grassGrad=ctx.createLinearGradient(0,hy,0,H);

    ctx.fillRect(W*0.5-hw,y0,hw*2,y1-y0);
  }

  ctx.restore();

  ctx.beginPath();ctx.moveTo(W*0.5-hw+1,hy);ctx.lineTo(W*0.5-hw+1,H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W*0.5+hw-1,hy);ctx.lineTo(W*0.5+hw-1,H);ctx.stroke();

    if(y1<=y0)continue;
    ctx.beginPath();ctx.moveTo(W*0.5-hw*0.34,y0);ctx.lineTo(W*0.5-hw*0.34,y1);ctx.stroke();
    ctx.beginPath();ctx.moveTo(W*0.5+hw*0.34,y0);ctx.lineTo(W*0.5+hw*0.34,y1);ctx.stroke();
  }
  ctx.strokeStyle='rgba(255,255,255,0.45)';ctx.lineWidth=Math.max(1.5,W*0.003);
  for(let i=0;i<30;i++){

    if(y1<=y0)continue;

  const pulse=0.4+0.3*Math.sin(r.t*2.6);
  [0,1,2].forEach(lane=>{
    const lx=laneToX(lane);
    ctx.save();ctx.globalAlpha=0.18+0.18*pulse;
    const mg=ctx.createRadialGradient(lx,hy,0,lx,hy,W*0.018);
    mg.addColorStop(0,'rgba(0,200,255,0.8)');mg.addColorStop(1,'rgba(0,200,255,0)');

    ctx.restore();

  vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(0.65,'rgba(0,0,0,0.1)');vig.addColorStop(1,'rgba(0,0,0,0.45)');

}
function shade(hex,amt){
  const c=hex.replace('#','');
  const n=parseInt(c.length===3?c.split('').map(x=>x+x).join(''):c,16);
  let r=(n>>16)+amt,g=(n>>8&255)+amt,b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return `rgb(${r},${g},${b})`;
}
// FIXED SIZE real-life supercar — size never changes with distance

  ctx.lineTo(w*0.50,h*0.02);ctx.lineTo(w*0.46,h*0.20);ctx.quadraticCurveTo(0,h*0.28,-w*0.46,h*0.20);

  spec.addColorStop(0.5,'rgba(255,255,255,0.08)');spec.addColorStop(0.65,'rgba(255,255,255,0.18)');spec.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=spec;
  ctx.beginPath();
  ctx.moveTo(-w*0.42,-h*0.08);ctx.lineTo(-w*0.28,-h*0.22);ctx.lineTo(w*0.28,-h*0.22);
  ctx.lineTo(w*0.42,-h*0.08);ctx.lineTo(w*0.38,h*0.02);ctx.lineTo(-w*0.38,h*0.02);ctx.closePath();ctx.fill();
  // Side volume
  const side=ctx.createLinearGradient(-w*0.5,0,w*0.5,0);
  side.addColorStop(0,'rgba(0,0,0,0.4)');side.addColorStop(0.1,'rgba(0,0,0,0.12)');side.addColorStop(0.5,'rgba(0,0,0,0)');
  side.addColorStop(0.9,'rgba(0,0,0,0.12)');side.addColorStop(1,'rgba(0,0,0,0.4)');
  ctx.fillStyle=side;
  ctx.beginPath();
  ctx.moveTo(-w*0.46,h*0.20);ctx.lineTo(-w*0.50,h*0.02);ctx.lineTo(-w*0.44,-h*0.14);
  ctx.lineTo(-w*0.30,-h*0.26);ctx.lineTo(w*0.30,-h*0.26);ctx.lineTo(w*0.44,-h*0.14);
  ctx.lineTo(w*0.50,h*0.02);ctx.lineTo(w*0.46,h*0.20);ctx.quadraticCurveTo(0,h*0.28,-w*0.46,h*0.20);
  ctx.closePath();ctx.fill();

  const roofGrad=ctx.createLinearGradient(0,-h*0.5,0,-h*0.2);
  roofGrad.addColorStop(0,shade(color,20));roofGrad.addColorStop(1,shade(color,-22));
  ctx.fillStyle=roofGrad;
  ctx.beginPath();ctx.moveTo(-w*0.28,-h*0.26);ctx.lineTo(-w*0.18,-h*0.48);ctx.lineTo(w*0.18,-h*0.48);ctx.lineTo(w*0.28,-h*0.26);ctx.closePath();ctx.fill();

  ctx.beginPath();ctx.moveTo(w*0.48,0);ctx.lineTo(w*0.36,-h*0.06);ctx.lineTo(w*0.34,h*0.08);ctx.lineTo(w*0.46,h*0.12);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(-w*0.45,0,w*0.08,h*0.08);ctx.fillRect(w*0.37,0,w*0.08,h*0.08);

  ctx.fillStyle='rgba(25,45,65,0.9)';
  ctx.fillRect(-w*0.52,-h*0.15,w*0.05,h*0.03);ctx.fillRect(w*0.47,-h*0.15,w*0.05,h*0.03);

    ctx.fillStyle='#ff5555';ctx.fillRect(-w*0.30,h*0.14,w*0.60,h*0.025);

  }else{

function spawnObstacle(){raceState.obstacles.push({lane:Math.floor(Math.random()*3),y:0,color:PALETTE[Math.floor(Math.random()*PALETTE.length)]});}
function spawnCoin(){raceState.coins.push({lane:Math.floor(Math.random()*3),y:0});}
function loop(ts){
  if(!raceState||raceState.crashed)return;
  const r=raceState;
  if(r.lastTs==null)r.lastTs=ts;
  let dt=(ts-r.lastTs)/1000;r.lastTs=ts;dt=Math.min(dt,0.05);const f=dt*60;r.t+=dt;
  const rampT=Math.min(1,r.dist/900);
  r.speed=r.baseSpeed+(r.topSpeed-r.baseSpeed)*rampT;r.dist+=r.speed*0.15*f;
  if(Math.random()<(0.008+r.speed*0.0016)*f)spawnObstacle();
  if(Math.random()<(0.02+r.speed*0.001)*f)spawnCoin();
  const advance=r.speed*0.0032*f;
  r.obstacles.forEach(o=>o.y+=advance*(0.5+clamp01(o.y)*1.2));
  r.coins.forEach(c=>c.y+=advance*(0.5+clamp01(c.y)*1.2));
  r.obstacles=r.obstacles.filter(o=>o.y<1.05);
  r.coins=r.coins.filter(c=>c.y<1.05);
  if(r.visualLane==null)r.visualLane=r.lane;
  r.visualLane+=(r.lane-r.visualLane)*Math.min(1,14*dt);
  r.obstacles.forEach(o=>{if(o.lane===r.lane&&Math.abs(o.y-r.playerY)<0.045&&!o.hit){o.hit=true;crash();}});
  r.coins=r.coins.filter(c=>{if(c.lane===r.lane&&Math.abs(c.y-r.playerY)<0.05){r.coinsEarned+=5;return false;}return true;});
  drawRoad(r);
  r.obstacles.forEach(o=>drawCarSprite(laneToX(o.lane),screenY(o.y),o.color,1,true,o.y));
  r.coins.forEach(c=>{
    const cy=screenY(c.y),cs=0.85;
    ctx.save();ctx.translate(laneToX(c.lane),cy);
    const cg=ctx.createRadialGradient(-W*0.003*cs,-W*0.003*cs,0,0,0,W*0.018*cs);
    cg.addColorStop(0,'#fff6b0');cg.addColorStop(0.45,'#ffcd3c');cg.addColorStop(1,'#c99a18');
    ctx.fillStyle=cg;ctx.shadowColor='#ffcd3c';ctx.shadowBlur=10*cs;
    ctx.beginPath();ctx.arc(0,0,W*0.017*cs,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(180,130,20,0.55)';ctx.lineWidth=Math.max(1,W*0.0025*cs);
    ctx.beginPath();ctx.arc(0,0,W*0.011*cs,0,Math.PI*2);ctx.stroke();ctx.restore();
  });
  const px=W*0.5+laneOffset(r.visualLane)*roadHalfWidth();
  drawCarSprite(px,screenY(r.playerY),r.car.color,1.05,false,1);
  document.getElementById('hudSpeed').textContent=Math.round(r.speed*40);
  document.getElementById('hudDist').textContent=Math.round(r.dist);
  document.getElementById('hudCoins').textContent=r.coinsEarned;
  if(r.running)requestAnimationFrame(loop);
}
function crash(){
  raceState.crashed=true;
  const earned=raceState.coinsEarned+Math.floor(raceState.dist/10);
  state.coins+=earned;
  if(raceState.dist>state.best)state.best=Math.round(raceState.dist);
  saveState();
  document.getElementById('finalDist').textContent=Math.round(raceState.dist);
  document.getElementById('finalCoins').textContent=earned;
  document.getElementById('crashOverlay').classList.add('show');
}
refreshCoinDisplays();
